<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ice Fishing Explainer</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
  </head>
  <body>
    <div id="app">
      <div id="game-wrap">
        <div id="game"></div>
        <div id="overlay">
          <div id="hudColumn">
            <div id="error-banner" class="error-banner hidden"></div>
            <div class="hud">
              <div>
                <strong>Sim time:</strong> <span id="timer">00:00</span>
                <span id="time-scale-label" class="time-scale"></span>
              </div>
              <div><strong>Player catches:</strong> <span id="player-catches">0</span></div>
              <div><strong>Rank:</strong> <span id="player-rank">-</span></div>
              <div id="debug-state" class="debug-state">State: - | Hole: no</div>
              <div id="stats-line" class="debug-state">Moves: - | Holes: - | Catches: -</div>
              <div id="player-debug" class="debug-state">PlayerState: - | Dest: - | Dist: -</div>
            </div>
            <div id="ui-panel" class="panel">
              <div class="controls">
                <div class="hint">Click on the lake to move.</div>
                <div class="seed-row">
                  <label for="seed-input">Seed</label>
                  <input type="text" id="seed-input" spellcheck="false" autocomplete="off" />
                </div>
                <div class="seed-actions">
                  <button id="seed-reset">Reset run</button>
                  <button id="seed-randomize">New seed</button>
                </div>
                <div class="inline">
                  <label>Sim speed</label>
                  <input type="range" id="sim-speed" min="0.5" max="2" step="0.1" value="1" />
                  <span id="sim-speed-value">1.0x</span>
                </div>
                <label class="toggle">
                  <input type="checkbox" id="show-gut" />
                  Show GUT indicator
                </label>
                <div id="status-message" class="status hidden"></div>
              </div>
              <div id="gut-panel" class="gut hidden">
                <h3>Giving-up pressure (GUT)</h3>
                <div class="gut-metric">Pressure: <span id="gut-pressure">0.00</span></div>
                <div class="gut-metric">Time since catch: <span id="gut-time">0s</span></div>
                <div class="gut-message" id="gut-message"></div>
                <div class="toast-stack" id="toast-stack"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script src="main.js"></script>
  </body>
</html>
