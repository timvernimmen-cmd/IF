<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Ice Fishing Explainer</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
  </head>
  <body>
    <div id="app">
      <div id="panel">
        <div id="hudColumn">
          <div id="error-banner" class="error-banner hidden"></div>
          <div class="hud">
            <div>
              <strong>Sim time:</strong> <span id="timer">00:00</span>
              <span id="time-scale-label" class="time-scale"></span>
            </div>
            <div><strong>Player catches:</strong> <span id="player-catches">0</span></div>
            <div><strong>Rank:</strong> <span id="player-rank">-</span></div>
          </div>
          <div class="hint">Click the ice to move.</div>
          <div id="ui-panel" class="panel">
            <div class="controls">
              <div class="seed-row">
                <label for="seed-input">Seed</label>
                <input type="text" id="seed-input" spellcheck="false" autocomplete="off" />
              </div>
              <div class="seed-actions">
                <button id="seed-reset">Start over</button>
                <button id="seed-randomize">New lake</button>
              </div>
              <div class="inline">
                <label>Match duration</label>
                <input type="range" id="sim-speed" min="0" max="1" step="0.01" value="1" />
                <span id="sim-speed-value">Match duration: standard</span>
              </div>
              <label class="toggle">
                <input type="checkbox" id="show-gut" />
                Time to move on?
              </label>
              <div id="status-message" class="status hidden"></div>
            </div>
            <div id="gut-panel" class="gut hidden">
              <h3>Time to move on?</h3>
              <div class="gut-metric">
                Time since your last catch: <span id="gut-time">0s</span>
              </div>
              <div class="gut-metric">
                Social confirmation: <span id="gut-social">none</span>
              </div>
              <div class="gut-metric" id="gut-recent-catches">
                Nearby recent catches: 0
              </div>
              <div class="gut-message" id="gut-message"></div>
              <div class="toast-stack" id="toast-stack"></div>
            </div>
          </div>
        </div>
      </div>
      <div id="game-wrap">
        <div id="game"></div>
        <div id="overlay">
          <div id="end-overlay" class="end-overlay hidden">
            <div class="end-modal">
              <h2 id="end-title"></h2>
              <p id="end-message"></p>
              <p id="end-submessage"></p>
              <p class="end-link">
                For more information about how real-life ice fishers make decisions,
                <a id="end-link" href="#">click here</a>.
              </p>
              <div class="end-actions">
                <button id="end-restart">Restart simulation</button>
                <button id="end-replay">Change speed and replay</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script src="main.js"></script>
  </body>
</html>
